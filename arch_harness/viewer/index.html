<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arch-harness viewer</title>
<style>
  :root { --bg: #f4f2ee; --ink: #1d1f22; --muted: #6b6f75; --panel: rgba(255,255,255,.92); --line: #d9d5cd;
          --ok: #2f7d4f; --bad: #b8322a; --accent: #d9822b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181b; --ink: #e9e7e3; --muted: #9a9ea5; --panel: rgba(28,30,34,.92); --line: #33363b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 16px; right: 16px; width: 320px; max-height: calc(100% - 32px); overflow: auto;
           background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
           backdrop-filter: blur(6px); }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 10px; }
  .kind { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .kind b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .kind span { font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  label.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; user-select: none; }
  label.chip input { margin: 0 4px 0 0; vertical-align: -1px; }
  #sel { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; min-height: 48px; }
  #sel code { font-size: 13px; background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 4px; }
  ul.fails { margin: 6px 0 0; padding-left: 16px; color: var(--bad); font-size: 12px; }
  #live { position: fixed; left: 16px; bottom: 16px; font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) {
    #panel { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; max-height: 45%; }
    #live { top: 12px; bottom: auto; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<aside id="panel">
  <h1 id="title">arch-harness</h1>
  <div class="sub" id="subtitle">waiting for model/model.json …</div>
  <div class="kinds" id="kinds"></div>
  <div class="row" id="storeys"></div>
  <div class="row"><label class="chip"><input type="checkbox" id="showSpaces" checked>spaces</label>
    <label class="chip"><input type="checkbox" id="showRoof">roof</label></div>
  <div id="sel"><span class="sub">Click an element to see its id.</span></div>
</aside>
<div id="live">live · polling the model</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
scene.background = new THREE.Color(dark ? 0x16181b : 0xf4f2ee);
const camera = new THREE.PerspectiveCamera(40, 1, 100, 500000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-30000, -40000, 60000); scene.add(sun);
const group = new THREE.Group(); scene.add(group);

const COLORS = { wall: 0xd8d3c8, door: 0x8c5a33, slab: 0xb9b9bd, space: 0x8cbfe6 };
let meshes = [], data = null, version = null, selected = null, framed = false;
const hidden = new Set();

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  if (w > 600) camera.setViewOffset(w, h, 170, 0, w, h); else camera.setViewOffset(w, h, 0, h * 0.2, w, h);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize();

function materialFor(s, failing) {
  if (s.id === selected) return new THREE.MeshStandardMaterial({ color: 0xd9822b, emissive: 0x6a3a10 });
  if (failing) return new THREE.MeshStandardMaterial({ color: 0xc23b30, emissive: 0x5a0d08 });
  const m = new THREE.MeshStandardMaterial({ color: COLORS[s.kind], roughness: .85 });
  if (s.kind === "space") { m.transparent = true; m.opacity = .45; }
  return m;
}

function visible(s) {
  if (hidden.has(s.storey)) return false;
  if (s.kind === "space" && !document.getElementById("showSpaces").checked) return false;
  if (s.kind === "slab" && s.role === "roof" && !document.getElementById("showRoof").checked) return false;
  return true;
}

function build() {
  for (const m of meshes) { group.remove(m); m.geometry.dispose(); m.material.dispose(); }
  meshes = [];
  const failing = new Set(data.failing);
  for (const s of data.solids) {
    if (!visible(s)) continue;
    const size = s.max.map((v, i) => v - s.min[i]);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), materialFor(s, failing.has(s.id)));
    mesh.position.set(...s.min.map((v, i) => v + size[i] / 2));
    mesh.userData = s;
    group.add(mesh); meshes.push(mesh);
  }
  if (!framed && data.building) {
    const b = data.building, c = new THREE.Vector3(b.x + b.w / 2, b.y + b.d / 2, b.height / 3);
    const r = Math.max(b.w, b.d, b.height);
    controls.target.copy(c);
    const far = window.innerWidth < 600 ? 2.4 : 1.05;
    camera.position.set(c.x - r * 0.9 * far, c.y - r * 1.2 * far, c.z + r * 0.9 * far);
    controls.update(); framed = true;
  }
}

const esc = x => String(x).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function panel() {
  document.getElementById("title").textContent = data.project || "arch-harness";
  const st = data.status;
  document.getElementById("subtitle").textContent = st
    ? `round ${st.round} · ${st.passed ? "all rules pass" : "rules failing"} · ${data.solids.length} elements`
    : `${data.solids.length} elements · not checked yet`;
  const kinds = document.getElementById("kinds");
  kinds.innerHTML = "";
  for (const k of ["code", "geometry", "brief"]) {
    const v = st ? st.by_kind[k] : null;
    const div = document.createElement("div"); div.className = "kind";
    const cls = !v ? "" : v.failed ? "bad" : v.passed ? "ok" : "";
    div.innerHTML = `<b>${esc(k)}</b><span class="${cls}">${v ? `✓${v.passed} ✗${v.failed}` : "–"}</span>`;
    kinds.appendChild(div);
  }
  const storeys = document.getElementById("storeys");
  storeys.innerHTML = "";
  for (const s of data.storeys || []) {
    const l = document.createElement("label"); l.className = "chip";
    l.innerHTML = `<input type="checkbox" ${hidden.has(s.id) ? "" : "checked"}>${esc(s.id)}`;
    l.querySelector("input").onchange = e => { e.target.checked ? hidden.delete(s.id) : hidden.add(s.id); build(); };
    storeys.appendChild(l);
  }
}

function showSelection(s) {
  const sel = document.getElementById("sel");
  if (!s) { sel.innerHTML = '<span class="sub">Click an element to see its id.</span>'; return; }
  const fails = (data.status?.failures || []).filter(f => f.element === s.id || (f.element || "").split("|").includes(s.id));
  sel.innerHTML = `<div><code>${esc(s.id)}</code> · ${esc(s.kind)}${s.name ? " · " + esc(s.name) : ""} · storey ${esc(s.storey)}</div>` +
    `<div class="sub">${s.max.map((v, i) => v - s.min[i]).join(" × ")} mm</div>` +
    (fails.length ? `<ul class="fails">${fails.map(f => `<li>${esc(f.rule)}: ${esc(f.message)}</li>`).join("")}</ul>` : "");
  fetch("/api/select", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: s.id }) });
}

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  ptr.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(meshes)[0];
  selected = hit ? hit.object.userData.id : null;
  build(); showSelection(hit ? hit.object.userData : null);
});
for (const id of ["showSpaces", "showRoof"]) document.getElementById(id).onchange = build;

async function poll() {
  try {
    const v = (await (await fetch("/api/version")).json()).version;
    if (v !== version) {
      data = await (await fetch("/api/model")).json();
      version = v; build(); panel();
      document.getElementById("live").textContent = `live · updated ${new Date().toLocaleTimeString()}`;
    }
  } catch (e) { document.getElementById("live").textContent = "viewer server not reachable"; }
}
poll(); setInterval(poll, 1000);
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
